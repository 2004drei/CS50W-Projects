<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="/CS50 Project 0/CSS/advancedSearch.css" />
    <title>Google Advanced Search</title>
    <link rel="icon" type="png" href="/CS50 Project 0/imgs/googleTabIcon.png">
  </head>

  <body>
    <header>
      <a href="">
        <img src="/CS50 Project 0/imgs/google_colored.png" alt="" id="logo" />
      </a>
    </header>
    <div id="outer_div">
      <form action="https://www.google.com/search" method="get" target="_blank">
      <h2>Advanced Search</h2>
      <h3>Find pages with</h3>
      <div id="formsZ">
        <div class="form_lines">
          <label for="all_words">All of these words:</label>
          <input type="text" name="as_q" id="all_words" class="input_box" />
        </div>
        <div class="form_lines">
          <label for="exact_word_phrase">This exact word or phrase:</label>
          <input
            type="text"
            name="as_epq"
            id="exact_word_phrase"
            class="input_box"
          />
        </div>
        <div class="form_lines">
          <label for="any_of_these_words">Any of these words:</label>
          <input
            type="text"
            name="as_oq"
            id="any_of_these_words"
            class="input_box"
          />
        </div>
        <div class="form_lines">
          <label for="none_of_these_words">None of these words:</label>
          <input
            type="text"
            name="as_eq"
            id="none_of_these_words"
            class="input_box"
          />
        </div>
      </form>
      <div>
        
      </div>
      <button type="submit" id="submit_button">
        Advanced Search
      </button>
      </div>
    </div>
  </body>
</html>
